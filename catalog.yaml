apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: pat-003-cloud-run-application-with-database
  title: "PAT-003 – Cloud Run Application with Database"
  description: >
    Application platform using Cloud Run services plus a managed SQL database
    and supporting security/identity modules.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - pattern
    - cloud-run
    - application-platform
    - database
    - sql
  links:
    - title: Pattern Registry
      url: https://internal.example.com/patterns/pat-003
spec:
  owner: platform-engineering
  domain: application-platform
  lifecycle: first_release_candidate
  profile:
    displayName: "PAT-003 Cloud Run Application with Database"
  metadata:
    releaseBucket: released_reusable_pattern
    firstReleaseTreatment: >
      First-release reusable pattern candidate for architecture/security approval.
    runtimeType: "Cloud Run"
    projectCount: 5
    buildingBlocks:
      required:
        - bastion
        - bucket
        - cloud_run
        - iam
        - keys
        - network
        - security_operations
        - security_policy
        - sql
      optional:
        - bigquery
        - composer
        - delivery
        - environment
        - integration
        - network_policy
        - pubsub