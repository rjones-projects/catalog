apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: pat-002-analytics-orchestration-pipeline
  title: "PAT-002 – Analytics / Orchestration Pipeline"
  description: >
    Legacy-style NWP delivery stack for orchestrated data processing with
    environments, SQL, buckets, and deploy chain modules.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - pattern
    - analytics
    - orchestration
    - data-pipeline
    - nwp
  links:
    - title: Pattern Registry
      url: https://internal.vodafone.com/patterns/pat-002
spec:
  owner: platform-engineering
  domain: data-platform
  lifecycle: first_release_candidate
  profile:
    displayName: "PAT-002 Analytics / Orchestration Pipeline"
  metadata:
    releaseBucket: released_reusable_pattern
    firstReleaseTreatment: >
      First-release reusable pattern candidate for architecture/security approval.
    runtimeType: "Composer / data orchestration"
    projectCount: 15
    buildingBlocks:
      required:
        - bastion
        - delivery
        - environment
        - integration
        - keys
        - network
        - security_operations
      optional:
        - bigquery
        - bucket
        - composer
        - gke
        - iam
        - network_policy
        - pubsub
        - security_policy
        - sql
